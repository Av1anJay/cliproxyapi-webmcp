name: release

# Scripted release instead of goreleaser on purpose: the plugin ID is derived
# from the .so file name, so every archive must contain a file literally named
# webmcp.so. goreleaser renames build outputs per platform, which would ship
# webmcp_linux_amd64 and make the host register a plugin called
# "webmcp_linux_amd64" instead of "webmcp".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: build linux/amd64
        run: |
          mkdir -p dist/stage
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildmode=c-shared -o dist/stage/webmcp.so .
          rm -f dist/stage/webmcp.h

      - name: package amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "dist/webmcp_${VERSION}_linux_amd64.tar.gz" \
            -C dist/stage webmcp.so \
            -C "$GITHUB_WORKSPACE" README.md config.example.yaml

      - name: build linux/arm64
        run: |
          rm -f dist/stage/webmcp.so
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -trimpath -buildmode=c-shared -o dist/stage/webmcp.so .
          rm -f dist/stage/webmcp.h

      - name: package arm64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "dist/webmcp_${VERSION}_linux_arm64.tar.gz" \
            -C dist/stage webmcp.so \
            -C "$GITHUB_WORKSPACE" README.md config.example.yaml

      - name: checksums
        run: cd dist && sha256sum *.tar.gz > sha256sums.txt && cat sha256sums.txt

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
          generate_release_notes: true
